name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure project
        run: cmake -S backend -B backend/build

      - name: Build project
        run: cmake --build backend/build

      - name: Run tests
        run: |
          cd backend/build
          ctest --output-on-failure